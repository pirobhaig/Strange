      rel="stylesheet"
    />
    <script>
      window.addEventListener(
        'error',
        function (event) {
          var src = (event && event.filename) || '';
          var msg = (event && event.message) || '';
          if (
            src.indexOf('chrome-extension://') === 0 ||
            src.indexOf('moz-extension://') === 0 ||
            msg.indexOf('Cannot set property fetch of #<Window>') !== -1
          ) {
            event.preventDefault();
            event.stopImmediatePropagation();
          }
        },
        true
      );
    </script>
  </head>
  <body class="bg-[#07090D] text-[#E6EDF3] antialiased selection:bg-cyan-500/25 selection:text-cyan-200">

  </body>
